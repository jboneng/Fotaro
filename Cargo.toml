[workspace]
members = ["crates/app", "crates/catalog", "crates/imaging", "crates/lensdb", "crates/libraw", "crates/segment", "crates/xmp"]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["persistence"] }
env_logger = "0.11.11"
log = "0.4.35"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
walkdir = "2.5.0"
tempfile = "3"
rusqlite = { version = "0.41.1", features = ["bundled", "functions"] }
dunce = "1.0.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp", "rayon"] }

catalog = { path = "crates/catalog" }
lensdb = { path = "crates/lensdb" }
libraw = { path = "crates/libraw" }
imaging = { path = "crates/imaging" }
xmp = { path = "crates/xmp" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep debug builds usable: optimize dependencies (LibRaw, image decoding,
# rendering) while leaving our own crates fast to compile.
[profile.dev.package."*"]
opt-level = 2

# Our own pixel code too: Develop renders 10-30x slower unoptimized, which makes a plain
# `cargo run` feel broken. The app and the catalog stay unoptimized (quick to rebuild).
[profile.dev.package.imaging]
opt-level = 3

[profile.dev.package.segment]
opt-level = 3

[profile.dev.package.lensdb]
opt-level = 3

[profile.dev.package.libraw]
opt-level = 3

[profile.dev.package.xmp]
opt-level = 3
# Its tests unoptimized, as before: optimized, the test build takes many minutes (and the
# tests themselves only half a minute unoptimized).
[profile.test.package.imaging]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
