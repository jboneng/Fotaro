[package]
name = "photo_library"
version = "0.1.0"
edition = "2024"
description = "A desktop photo library"
publish = false

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["persistence"] }
env_logger = "0.11.11"
log = "0.4.35"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"

# Keep debug builds usable: optimize dependencies (image decoding, rendering)
# while leaving our own crate fast to compile.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
