[workspace]
members = ["crates/app", "crates/catalog", "crates/imaging", "crates/libraw", "crates/xmp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["persistence"] }
env_logger = "0.11.11"
log = "0.4.35"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
walkdir = "2.5.0"
tempfile = "3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
dunce = "1.0.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp", "rayon"] }

catalog = { path = "crates/catalog" }
libraw = { path = "crates/libraw" }
imaging = { path = "crates/imaging" }
xmp = { path = "crates/xmp" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep debug builds usable: optimize dependencies (LibRaw, image decoding,
# rendering) while leaving our own crates fast to compile.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
