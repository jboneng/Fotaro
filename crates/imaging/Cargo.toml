[package]
name = "imaging"
description = "Decoding (RAW via LibRaw, images via `image`), color management and the preview cache"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
libraw.workspace = true
image.workspace = true
anyhow.workspace = true
log.workspace = true

lcms2 = "6.2.0"
kamadak-exif = "0.6.2"
chrono = "0.4.45"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
memmap2 = "0.9"
serde.workspace = true
serde_json = "1.0.154"
flate2 = "1.1"
png = "0.18"
rayon = "1.12"
bytemuck = "1"
ab_glyph = "0.2.32"
epaint_default_fonts = "0.37.0"

[dev-dependencies]
tempfile.workspace = true
catalog.workspace = true
xmp.workspace = true
mimalloc = "0.1.52"

[lints]
workspace = true
